[project]
name = "cirno-core"
version = "0.2.17"
description = "Cirno execution engine, tools, providers and memory coordination"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "cirno-setup==0.2.17",
    "cirno-memory==0.2.17",
    "cirno-usage==0.2.17",
    "cirno-vault==0.2.17",
    "anthropic>=0.100.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "httpx[socks]>=0.28.0,<1.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "yarl>=1.17.0,<2.0.0",
    "ddgs>=9.16.1,<10.0.0",
    "oauth-cli-kit>=0.1.6,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "lxml-html-clean>=0.4.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "pillow>=13.0.0,<14.0.0",
    "croniter>=6.0.0,<7.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "regex>=2024.11.6,<2027.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "dulwich>=1.2.20,<2.0.0",
    "rapidfuzz>=3.14.6,<4.0.0",
    "pyyaml>=6.0,<7.0.0",
    "filelock>=3.25.2",
    "packaging>=24.0",
    "tzdata>=2025.2",
    "tzlocal>=5.3.1,<6.0.0",
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=6.21.3,<7.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
memory-embedding = [
    "cirno-memory[embedding]==0.2.17",
]
azure = [
    "azure-identity>=1.19.0,<2.0.0",
]
bedrock = [
    "boto3>=1.43.0",
    "botocore>=1.43.0,<2.0.0",
]
olostep = [
    "olostep>=0.1.0; python_version < '3.14'",
]

[build-system]
requires = ["hatchling", "filelock>=3.25.2"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/cirno_core"]
exclude = ["**/tests/**", "**/__pycache__/**", "**/*.py[cod]"]

[tool.hatch.build.targets.sdist]
include = ["src", "hatch_build.py", "pyproject.toml", "LICENSE", "THIRD_PARTY_NOTICES.md"]
exclude = ["**/tests/**", "**/__pycache__/**", "**/*.py[cod]"]
