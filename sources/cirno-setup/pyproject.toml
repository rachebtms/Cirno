[project]
name = "cirno-setup"
version = "0.2.10"
description = "Independent, dependency-aware Cirno environment provisioning"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["packaging>=24", "filelock>=3.25.2"]

[project.scripts]
cirno-setup = "cirno_setup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cirno_setup"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "LICENSE"]
