<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=auto"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Cirno web UI — chat with your Cirno workspace."
      data-i18n-meta="description"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      data-theme-color-light="#ffffff"
      data-theme-color-dark="#303030"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cirno" />
    <link rel="icon" type="image/svg+xml" href="/brand/cirno_snowflake_mark.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/brand/cirno_snowflake_favicon_32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/cirno_snowflake_apple_touch.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      /* App-like feel on touch devices: no double-tap zoom on interactive
         elements (system-level accessibility zoom still works), and no text
         size inflation on orientation change. */
      html {
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #0a0a0a;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }

      html.dark body {
        background: #303030;
        color: #fafafa;
      }

      /* Work around iOS standalone's scroll-edge blur with a fixed color surface.
         Keep this outside React's root for cold starts and route changes.
         See docs/guides/ios-pwa-status-bar.md for the WebKit sampling contract. */
      .pwa-status-bar-surface { display: none; }
      @supports (-webkit-touch-callout: none) and (background-clip: text) {
        @media (display-mode: standalone) {
          .pwa-status-bar-surface {
            display: block;
            position: fixed;
            inset: 0 0 auto;
            height: 11px; /* Must exceed WebKit's 10px thin-border threshold. */
            z-index: 100;
            pointer-events: none;
            background-color: inherit;
            -webkit-background-clip: text;
            background-clip: text; /* Empty text paints nothing over the controls. */
          }
        }
      }

    </style>
    <!--startup-style-->
    <script>
      (function () {
        try {
          var stored = null;
          try {
            stored = localStorage.getItem("cirno-webui.theme");
          } catch {}
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            var color = themeColor.getAttribute(
              dark ? "data-theme-color-dark" : "data-theme-color-light"
            );
            if (color) themeColor.setAttribute("content", color);
          }
        } catch {}
      })();
    </script>
    <title>Cirno</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div class="pwa-status-bar-surface" aria-hidden="true"></div>
    <div id="root"><!--startup-shell--></div>
    <!--startup-script-->
    <script>
      (function () {
        var localeKey = "cirno.locale";
        var copy = {
          en: {
            boot: "Loading Cirno…",
            description: "Cirno web UI — chat with your Cirno workspace."
          },
          "zh-CN": {
            boot: "正在加载 Cirno…",
            description: "Cirno Web UI —— 与你的 Cirno 工作区对话。"
          },
          "zh-TW": {
            boot: "正在載入 Cirno…",
            description: "Cirno Web UI —— 與你的 Cirno 工作區對話。"
          },
          fr: {
            boot: "Chargement de Cirno…",
            description: "Interface web Cirno — discutez avec votre espace de travail Cirno."
          },
          ja: {
            boot: "Cirno を読み込み中…",
            description: "Cirno Web UI — Cirno ワークスペースと会話します。"
          },
          ko: {
            boot: "Cirno 불러오는 중…",
            description: "Cirno 웹 UI — Cirno 작업공간과 대화하세요."
          },
          es: {
            boot: "Cargando Cirno…",
            description: "Interfaz web de Cirno: conversa con tu espacio de trabajo de Cirno."
          },
          "pt-BR": {
            boot: "Carregando Cirno…",
            description: "Interface web do Cirno — converse com o seu espaço de trabalho do Cirno."
          },
          vi: {
            boot: "Đang tải Cirno…",
            description: "Giao diện web Cirno — trò chuyện với không gian làm việc Cirno của bạn."
          },
          id: {
            boot: "Memuat Cirno…",
            description: "UI web Cirno — ngobrol dengan ruang kerja Cirno Anda."
          }
        };

        function normalizeLocale(input) {
          if (!input) return "en";
          var raw = String(input).trim();
          if (!raw) return "en";
          if (copy[raw]) return raw;
          var lower = raw.toLowerCase();
          if (lower === "zh" || lower.indexOf("zh-cn") === 0 || lower.indexOf("zh-sg") === 0) {
            return "zh-CN";
          }
          if (
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-TW";
          }
          if (lower === "pt" || lower.indexOf("pt-") === 0) {
            return "pt-BR";
          }
          var base = lower.split("-")[0];
          return copy[base] ? base : "en";
        }

        try {
          var stored = localStorage.getItem(localeKey);
          var detected =
            stored ||
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var locale = normalizeLocale(detected);
          var localized = copy[locale] || copy.en;
          document.documentElement.lang = locale;
          var description = document.querySelector('[data-i18n-meta=\"description\"]');
          if (description) description.setAttribute("content", localized.description);
          var boot = document.querySelector("[data-boot-copy]");
          if (boot) boot.textContent = localized.boot;
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
