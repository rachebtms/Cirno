[project]
name = "cirno-core"
version = "0.1.4"
description = "Cirno execution engine, memory, tools, and model providers"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "anthropic>=0.100.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "httpx[socks]>=0.28.0,<1.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "yarl>=1.17.0,<2.0.0",
    "cryptography>=46.0.0",
    "ddgs>=9.16.1,<10.0.0",
    "oauth-cli-kit>=0.1.6,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "lxml-html-clean>=0.4.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "pillow>=13.0.0,<14.0.0",
    "croniter>=6.0.0,<7.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "dulwich>=1.2.20,<2.0.0",
    "rapidfuzz>=3.14.6,<4.0.0",
    "pyyaml>=6.0,<7.0.0",
    "filelock>=3.25.2",
    "packaging>=24.0",
    "tzdata>=2025.2",
    "tzlocal>=5.3.1,<6.0.0",
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=6.21.3,<7.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
memory-embedding = [
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
    "numpy>=1.26,<3",
]
azure = [
    "azure-identity>=1.19.0,<2.0.0",
]
bedrock = [
    "boto3>=1.43.0",
    "botocore>=1.43.0,<2.0.0",
]
olostep = [
    "olostep>=0.1.0; python_version < '3.14'",
]

[build-system]
requires = ["hatchling", "editables", "filelock>=3.25.2"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
bypass-selection = true
exclude = ["/tests/**", "**/tests/**", "**/__pycache__/**", "**/*.py[cod]", "/pyproject.toml", "/hatch_build.py", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/dist/**", "/.pytest_cache/**", "/.ruff_cache/**"]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.sdist]
include = ["/**/*.py", "/**/*.md", "/**/*.json", "/**/*.png", "/pyproject.toml", "/LICENSE", "/THIRD_PARTY_NOTICES.md"]
exclude = ["**/tests/**", "**/__pycache__/**", "/dist/**", "**/.pytest_cache/**", "**/.ruff_cache/**"]
