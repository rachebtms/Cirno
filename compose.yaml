x-common-config: &common-config
  image: ghcr.io/rachebtms/cirno:${CIRNO_IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      CIRNO_CHANNELS: ${CIRNO_CHANNELS:-}
  environment:
    # Bootstrap a working config.json on first boot (binds that work across
    # the container boundary; secrets generated if not provided).
    CIRNO_DOCKER_BOOTSTRAP: "1"
    CIRNO_WEB_TOKEN: ${CIRNO_WEB_TOKEN:-}
    CIRNO_API_KEY: ${CIRNO_API_KEY:-}
  volumes:
    - ~/.cirno:/home/cirno/.cirno
  cap_drop:
    - ALL
  # Entrypoint uses these to fix bind-mount ownership and drop to the cirno user.
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  # Prevent the non-root process from regaining capabilities through setuid
  # binaries or file capabilities left inside the container image.
  security_opt:
    - no-new-privileges:true

services:
  cirno-gateway:
    container_name: cirno-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: ${CIRNO_MEMORY_LIMIT:-400M}
        reservations:
          cpus: "0.25"
          memory: 256M

