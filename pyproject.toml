[project]
name = "cirno-ai"
version = "0.1.5"
description = "A lightweight personal AI assistant framework"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Cirno contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

dependencies = ["cirno-server==0.1.5"]

[project.optional-dependencies]
memory-embedding = [
    "cirno-core[memory-embedding]==0.1.5",
]
azure = [
    "cirno-core[azure]==0.1.5",
]
bedrock = [
    "cirno-core[bedrock]==0.1.5",
]
olostep = [
    "cirno-core[olostep]==0.1.5",
]
dev = [
    "hatchling",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "virtualenv>=20.35.4,<21.0.0",
    "ruff>=0.1.0",
    "basedpyright>=1.39.0,<2.0.0",
    "pymupdf>=1.25.0",
    "msgpack>=1.1.0,<2.0.0",
]

[project.scripts]
cirno = "cirno_server.cli.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sources/cirno"]

[tool.hatch.build.targets.sdist]
include = ["sources/cirno", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The source directory is remapped to the valid installed package name cirno.
"sources/cirno-core/**" = ["N999"]
"sources/cirno-server/**" = ["N999"]

[tool.basedpyright]
include = ["sources/cirno-core", "sources/cirno-server", "sources/cirno"]
exclude = ["**/tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["sources/cirno-core/tests", "sources/cirno-server/tests", "sources/cirno-server/channels"]

[tool.coverage.run]
source = ["cirno_core", "cirno_server", "cirno"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
fail_under = 75
# Discovery of unexecuted source files also includes colocated channel tests.
# Match run.omit so the application gate never counts test bodies as product code.
omit = ["tests/*", "**/tests/*"]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
