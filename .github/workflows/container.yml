name: Verify and publish container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sources/cirno-web/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify Web UI
        working-directory: sources/cirno-web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Install backend and channel test dependencies
        env:
          CIRNO_SKIP_WEBUI_BUILD: '1'
        run: |
          python -m pip install -e '.[dev]'
          python sources/deployment/install_channel_dependencies.py --all-channels
      - name: Verify backend
        run: |
          python -m ruff check sources/cirno-core hatch_build.py --exclude '**/tests/**' --exclude '**/conftest.py' --select F
          python sources/development/check_import_boundaries.py --root sources/cirno-core
          python -m pytest -q

  container:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: cirno:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container startup and Web UI
        run: |
          docker run -d --name cirno-smoke --memory=400m -p 127.0.0.1:18790:18790 -p 127.0.0.1:8765:8765 -e CIRNO_DOCKER_BOOTSTRAP=1 -e CIRNO_WEB_TOKEN=ci-smoke-only cirno:smoke gateway --foreground
          trap 'docker logs cirno-smoke; docker rm -f cirno-smoke' EXIT
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:18790/health
          curl --fail http://127.0.0.1:8765/ | grep -q '<html'
          docker exec cirno-smoke grep -Eq '^Uid:[[:space:]]+1000[[:space:]]' /proc/1/status
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish AMD64 and ARM64 images
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
