name: Diagnose container DNS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolver:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Use working upstream DNS on the runner
        run: |
          interface=$(ip -o -4 route show to default | awk 'NR == 1 { print $5 }')
          sudo resolvectl dns "$interface" 1.1.1.1 1.0.0.1
          sudo resolvectl flush-caches
          getent ahostsv4 archive.ubuntu.com
          getent ahostsv4 ports.ubuntu.com
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers = ["1.1.1.1", "1.0.0.1"]
      - name: Verify normal container and build APT access
        run: |
          docker run --rm ubuntu:24.04 apt-get -o APT::Update::Error-Mode=any update
          mkdir -p /tmp/resolver-probe
          printf '%s\n' 'FROM ubuntu:24.04' 'RUN apt-get -o APT::Update::Error-Mode=any update' > /tmp/resolver-probe/Dockerfile
          docker buildx build --progress plain /tmp/resolver-probe
