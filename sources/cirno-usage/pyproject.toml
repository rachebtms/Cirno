[project]
name = "cirno-usage"
version = "0.2.10"
description = "Content-free LLM usage records and SQLite accounting"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cirno_usage"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "LICENSE"]
