name: Verify and publish container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/rachebtms/cirno

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sources/cirno-web/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: Verify Web UI
        working-directory: sources/cirno-web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Install backend and channel test dependencies
        env:
          CIRNO_SKIP_WEBUI_BUILD: '1'
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e sources/cirno-setup -e sources/cirno-memory -e sources/cirno-usage -e sources/cirno-vault -e sources/cirno-core -e sources/cirno-server -e '.[dev]'
          .venv/bin/python sources/deployment/install_channel_dependencies.py --all-channels
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify backend
        run: |
          python -m ruff check sources/cirno-setup sources/cirno-memory sources/cirno-usage sources/cirno-vault sources/cirno-core sources/cirno-server --exclude '**/tests/**' --exclude '**/conftest.py' --select F
          python sources/development/check_import_boundaries.py
          python -m pytest -q -n 2

  container:
    name: Container (${{ matrix.arch }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: cirno:smoke
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Verify container startup and Web UI
        run: |
          mounts=(--mount source=cirno-smoke-data,target=/home/cirno/.cirno)
          docker run --rm --entrypoint mkdir "${mounts[@]}" cirno:smoke -p /home/cirno/.cirno/state/tools/homebrew
          mounts+=(--mount source=cirno-smoke-data,target=/home/linuxbrew/.linuxbrew,volume-subpath=state/tools/homebrew)
          docker run -d --name cirno-smoke --memory=400m "${mounts[@]}" -p 127.0.0.1:18790:18790 -p 127.0.0.1:8765:8765 -e CIRNO_DOCKER_BOOTSTRAP=1 cirno:smoke
          python sources/development/wait_for_container.py --timeout 90
          curl --fail --output /tmp/cirno-smoke.html http://127.0.0.1:8765/
          grep -q '<html' /tmp/cirno-smoke.html
          python3 - <<'PY'
          import http.cookiejar
          import json
          import urllib.request
          base = "http://127.0.0.1:8765"
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          assert json.load(client.open(base + "/v0/auth/status"))["registration_required"]
          request = urllib.request.Request(base + "/v0/auth/register", data=json.dumps({
              "username": "ci-owner", "password": "Ci-container-smoke-password!",
          }).encode(), headers={"Content-Type": "application/json"})
          assert client.open(request).status == 201
          bootstrap = json.load(client.open(base + "/v0/bootstrap"))
          assert bootstrap["browser_auth"] and bootstrap["onboarding_required"]
          assert bootstrap["token"] and bootstrap["api_token"]
          PY
          docker exec cirno-smoke grep -Eq '^Uid:[[:space:]]+1000[[:space:]]' /proc/1/status
      - name: Verify base, selected preset and container recreation
        run: |
          docker cp sources/development/verify_setup_image.py cirno-smoke:/tmp/verify_setup_image.py
          docker exec --user 1000:1000 cirno-smoke /app/.venv/bin/python /tmp/verify_setup_image.py --base
          docker cp sources/development/verify_setup_minimal.py cirno-smoke:/tmp/verify_setup_minimal.py
          docker exec --user 1000:1000 cirno-smoke /app/.venv/bin/python /tmp/verify_setup_minimal.py
          docker cp sources/development/verify_setup_toolchains.py cirno-smoke:/tmp/verify_setup_toolchains.py
          docker exec --user 1000:1000 cirno-smoke /app/.venv/bin/python /tmp/verify_setup_toolchains.py
          docker rm -f cirno-smoke
          docker run -d --name cirno-smoke --memory=1g --mount source=cirno-smoke-data,target=/home/cirno/.cirno --mount source=cirno-smoke-data,target=/home/linuxbrew/.linuxbrew,volume-subpath=state/tools/homebrew -p 127.0.0.1:18790:18790 -p 127.0.0.1:8765:8765 -e CIRNO_DOCKER_BOOTSTRAP=1 cirno:smoke +presets.rachebtms --timeout 1800 --verify
          python sources/development/wait_for_container.py --timeout 1800
          docker cp sources/development/verify_setup_image.py cirno-smoke:/tmp/verify_setup_image.py
          docker cp sources/development/verify_setup_media.py cirno-smoke:/tmp/verify_setup_media.py
          docker exec --user 1000:1000 cirno-smoke /app/.venv/bin/python /tmp/verify_setup_image.py
          docker exec cirno-smoke apt-get update
          docker exec -e DEBIAN_FRONTEND=noninteractive cirno-smoke apt-get install -y --no-install-recommends hello
          docker rm -f cirno-smoke
          docker run -d --name cirno-smoke --memory=1g --mount source=cirno-smoke-data,target=/home/cirno/.cirno --mount source=cirno-smoke-data,target=/home/linuxbrew/.linuxbrew,volume-subpath=state/tools/homebrew -p 127.0.0.1:18790:18790 -p 127.0.0.1:8765:8765 -e CIRNO_DOCKER_BOOTSTRAP=1 cirno:smoke +presets.rachebtms --timeout 1800 --verify
          python sources/development/wait_for_container.py --timeout 600
          curl --fail http://127.0.0.1:8765/v0/auth/status | python3 -c 'import json, sys; assert not json.load(sys.stdin)["registration_required"]'
          docker cp sources/development/verify_setup_image.py cirno-smoke:/tmp/verify_setup_image.py
          docker exec --user 1000:1000 cirno-smoke /app/.venv/bin/python /tmp/verify_setup_image.py --check-persistence
          docker exec --user 1000:1000 cirno-smoke hello
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove smoke container
        if: always()
        run: |
          if docker container inspect cirno-smoke >/dev/null 2>&1; then
            docker logs cirno-smoke
            docker rm -f cirno-smoke
          fi
          if docker volume inspect cirno-smoke-data >/dev/null 2>&1; then
            docker volume rm cirno-smoke-data
          fi
      - name: Push verified image by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Export image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform manifest
    if: github.event_name != 'pull_request'
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge and publish verified images
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(--tag "$tag"); done
          images=()
          for digest in *; do images+=("$REGISTRY_IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tag_args[@]}" "${images[@]}"
          docker buildx imagetools inspect "${tags[0]}"
