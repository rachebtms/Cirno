name: Verify and publish container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/rachebtms/cirno

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sources/cirno-web/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sources/cirno-core/pyproject.toml
            sources/cirno-server/pyproject.toml
            sources/cirno-server/channels/*/manifest.py
      - name: Verify Web UI
        working-directory: sources/cirno-web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Install backend and channel test dependencies
        env:
          CIRNO_SKIP_WEBUI_BUILD: '1'
        run: |
          python -m pip install -e sources/cirno-core -e sources/cirno-server -e '.[dev]'
          python sources/deployment/install_channel_dependencies.py --all-channels
      - name: Verify backend
        run: |
          python -m ruff check sources/cirno-core sources/cirno-server --exclude '**/tests/**' --exclude '**/conftest.py' --select F
          python sources/development/check_import_boundaries.py
          python -m pytest -q -n 2

  container:
    name: Container (${{ matrix.variant }}, ${{ matrix.arch }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant: [slim, full]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - variant: slim
            suffix: ""
          - variant: full
            suffix: "-full"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-args: CIRNO_VARIANT=${{ matrix.variant }}
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: cirno:smoke
          cache-from: type=gha,scope=container-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Verify container startup and Web UI
        run: |
          docker run -d --name cirno-smoke --memory=400m -p 127.0.0.1:18790:18790 -p 127.0.0.1:8765:8765 -e CIRNO_DOCKER_BOOTSTRAP=1 cirno:smoke
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 90 --connect-timeout 2 --max-time 5 http://127.0.0.1:18790/health
          curl --fail --output /tmp/cirno-smoke.html http://127.0.0.1:8765/
          grep -q '<html' /tmp/cirno-smoke.html
          python3 - <<'PY'
          import http.cookiejar
          import json
          import urllib.request
          base = "http://127.0.0.1:8765"
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          assert json.load(client.open(base + "/api/auth/status"))["registration_required"]
          request = urllib.request.Request(base + "/api/auth/register", data=json.dumps({
              "username": "ci-owner", "password": "Ci-container-smoke-password!",
          }).encode(), headers={"Content-Type": "application/json"})
          assert client.open(request).status == 201
          bootstrap = json.load(client.open(base + "/webui/bootstrap"))
          assert bootstrap["browser_auth"] and bootstrap["onboarding_required"]
          assert bootstrap["token"] and bootstrap["api_token"]
          PY
          docker exec cirno-smoke grep -Eq '^Uid:[[:space:]]+1000[[:space:]]' /proc/1/status
      - name: Verify preinstalled tools and bundled embedding
        if: matrix.variant == 'full'
        run: |
          docker cp sources/development/verify_full_image.py cirno-smoke:/tmp/verify_full_image.py
          docker exec --user 1000:1000 cirno-smoke python /tmp/verify_full_image.py
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove smoke container
        if: always()
        run: |
          if docker container inspect cirno-smoke >/dev/null 2>&1; then
            docker logs cirno-smoke
            docker rm -f cirno-smoke
          fi
      - name: Push verified image by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-args: CIRNO_VARIANT=${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=container-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Export image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform manifest (${{ matrix.variant }})
    if: github.event_name != 'pull_request'
    needs: container
    strategy:
      matrix:
        include:
          - variant: slim
            suffix: ""
          - variant: full
            suffix: "-full"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge and publish verified images
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(--tag "$tag"); done
          images=()
          for digest in *; do images+=("$REGISTRY_IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tag_args[@]}" "${images[@]}"
          docker buildx imagetools inspect "${tags[0]}"
