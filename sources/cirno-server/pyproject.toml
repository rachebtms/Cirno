[project]
name = "cirno-server"
version = "0.2.12"
description = "Cirno server, Web UI API, and personal messaging channels"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "cirno-core==0.2.12",
    "typer>=0.20.0,<1.0.0",
    "websockets>=15.0,<17.0",
    "setproctitle>=1.3.7,<2.0.0; sys_platform != 'win32'",
    "watchfiles>=1.1.1,<2.0.0",
]

[build-system]
requires = ["hatchling", "filelock>=3.25.2"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/cirno_server"]
exclude = ["**/tests/**", "**/__pycache__/**", "**/*.py[cod]", "**/web/dist/**"]

[tool.hatch.build.targets.sdist]
include = ["src", "hatch_build.py", "pyproject.toml", "LICENSE", "THIRD_PARTY_NOTICES.md"]
exclude = ["**/tests/**", "**/__pycache__/**", "**/*.py[cod]", "**/web/dist/**"]
